<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Журнал">
<title>Журнал</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
:root{
  --bg:#000;--s1:#0b0b0b;--s2:#141414;--s3:#1c1c1c;--line:#222;--line2:#2e2e2e;
  --text:#f2f2f2;--muted:#8c8c8c;--dim:#575757;
  --pos:#3ddc84;--neg:#ff5d5d;--warn:#f0b44c;--r:14px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-color:#5a5a5a}
input[type=date],input[type=time]{min-height:46px;color-scheme:dark}
textarea{resize:vertical}
.hidden{display:none!important}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{width:100%;max-width:320px;text-align:center}
.login-title{font-size:30px;font-weight:700;letter-spacing:.3px}
.login-sub{color:var(--muted);margin:6px 0 26px}
#codeInput{text-align:center;font-size:26px;letter-spacing:10px;padding:14px;margin-bottom:12px}
.login-err{color:var(--neg);min-height:20px;margin-top:14px;font-size:14px}
.login-mode{color:var(--muted);font-size:12px;margin-top:6px;line-height:1.5}
.link{color:var(--muted);font-size:13px;margin-top:22px;text-decoration:underline;text-underline-offset:3px}

/* buttons */
.btn{padding:11px 16px;border-radius:10px;background:var(--s3);border:1px solid var(--line2);font-weight:600;font-size:15px}
.btn.primary{background:var(--text);color:#000;border-color:var(--text)}
.btn.danger{color:var(--neg)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--st)) 16px 10px;background:rgba(0,0,0,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-title{font-size:21px;font-weight:700}
.top-actions{display:flex;gap:2px}
.icon-btn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--s2);color:var(--text)}
.icon-btn svg{width:20px;height:20px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-badge{font-size:10px;font-weight:700;letter-spacing:.6px;color:#000;background:var(--warn);border-radius:6px;padding:2px 6px;margin-left:8px;vertical-align:middle}

main{max-width:760px;margin:0 auto;padding:14px 16px calc(100px + var(--sb))}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r)}
.h2{font-size:17px;font-weight:700}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}
.sec-head h2{margin:0;font-size:17px}
.empty{color:var(--muted);text-align:center;padding:26px 12px;border:1px dashed var(--line2);border-radius:var(--r);font-size:14px}

/* calendar */
.cal{padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:700;font-size:16px}
.nav{width:38px;height:38px;border-radius:10px;font-size:24px;line-height:1;color:var(--muted);display:grid;place-items:center}
.nav:hover{background:var(--s2);color:var(--text)}
.cal-week,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-week span{text-align:center;font-size:11px;color:var(--dim);text-transform:uppercase;padding:2px 0 4px;font-weight:600}
.day{height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--muted);border:1px solid transparent}
.day .num{font-size:15px;font-weight:600}
.day.has{color:var(--text);background:var(--s2)}
.day.today{border-color:#4a4a4a}
.day.sel{background:var(--text);color:#000;border-color:var(--text)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--warn)}
.dots i.d{background:var(--pos)}
.day.sel .dots i{background:#000}

.day-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:20px 2px 10px}
.day-head .muted{font-size:13px;margin-top:2px}

/* records */
.rec{display:flex;align-items:center;gap:12px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;cursor:pointer}
.rec:hover{border-color:var(--line2)}
.rec-time{font-weight:700;font-size:15px;min-width:46px;font-variant-numeric:tabular-nums}
.rec-main{flex:1;min-width:0}
.rec-client{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-tag{display:inline-block;margin-top:4px;font-size:11px;color:var(--neg);border:1px solid #4a2222;border-radius:6px;padding:1px 6px}
.rec-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec.done .rec-amt{color:var(--pos)}
.rec.cancelled{opacity:.5}
.rec.cancelled .rec-amt{text-decoration:line-through}
.chk{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;flex:none}
.chk svg{width:16px;height:16px}
.chk.on{background:var(--pos);border-color:var(--pos);color:#000}

/* period */
.period{margin-bottom:14px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button,.seg label{flex:1;text-align:center;padding:8px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--text);color:#000}
.seg input{display:none}
.seg input:checked+span{color:#000}
.seg label:has(input:checked){background:var(--text)}
.seg label:has(input[value=done]:checked){background:var(--pos)}
.seg label:has(input[value=cancelled]:checked){background:var(--neg)}
.period-nav{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.period-label{position:relative;font-weight:700;font-size:16px;padding:6px 10px;border-radius:10px;cursor:pointer}
.period-label:hover{background:var(--s2)}
.period-label input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;padding:0;border:0}

/* kassa */
.receipt{padding:16px 16px 14px}
.rline{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;font-variant-numeric:tabular-nums}
.rline span{color:var(--muted)}
.rline em{font-style:normal;color:var(--dim);font-size:12px;margin-left:4px}
.rline b{font-size:17px}
.rsep{border-top:1px dashed #3a3a3a;margin:10px 0 8px}
.rline.total span{color:var(--text);font-weight:600}
.rline.total b{font-size:24px}
.rnote{margin-top:8px;font-size:13px;color:var(--warn)}

.table{overflow:hidden}
.tr{display:grid;grid-template-columns:50px minmax(0,1fr) auto 36px;gap:10px;padding:11px 12px;border-top:1px solid var(--line);align-items:center;font-variant-numeric:tabular-nums}
.tr:first-child{border-top:0}
.tr.th{font-size:11px;color:var(--dim);text-transform:uppercase;font-weight:700;letter-spacing:.4px;padding-top:10px;padding-bottom:8px}
.tr.click{cursor:pointer}
.tr.click:hover{background:var(--s2)}
.tr.tf{border-top:1px solid var(--line2);font-weight:700;background:var(--s2)}
.tr .r{text-align:right}.tr .c{text-align:center}
.ell{min-width:0}
.ell b,.ell small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ell b{font-weight:600}
.ell small{color:var(--muted);font-size:12px}
.rcpt{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--s3);color:var(--text)}
.rcpt svg{width:16px;height:16px}

.cats{padding:12px 14px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0;font-size:14px}
.cat .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.cat .bar i{display:block;height:100%;background:#9a9a9a;border-radius:2px}

details.fold{margin-top:12px}
details.fold summary{list-style:none;cursor:pointer;padding:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"›";color:var(--muted);font-size:20px;transition:transform .15s}
details.fold[open] summary::after{transform:rotate(90deg)}
.done-list .tr{grid-template-columns:50px minmax(0,1fr) auto}

/* calculator */
.calc{padding:0 14px 14px}
.calc-disp{background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:right;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;word-break:break-all;min-height:58px}
.calc-prev{text-align:right;color:var(--muted);font-size:14px;min-height:20px;margin:4px 4px 8px}
.calc-ins{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.calc-ins button{flex:1;padding:8px;border-radius:9px;background:var(--s2);border:1px solid var(--line2);font-size:12px;font-weight:600;color:var(--muted)}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{height:50px;border-radius:12px;background:var(--s3);font-size:19px;font-weight:600}
.calc-keys button.op{background:#2a2a2a}
.calc-keys button.eq{background:var(--text);color:#000}
.calc-keys button:active{opacity:.6}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px}
.kpi span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi.wide{grid-column:span 3;display:flex;justify-content:space-between;align-items:center}
.kpi.wide b{font-size:24px}
.chart-box{position:relative;height:270px;padding:12px 8px 8px;margin-top:12px}
.chart-msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px}
.stbl .tr{grid-template-columns:minmax(0,1.1fr) 1fr 1fr 1fr;font-size:14px}
.stbl .tr.dim{color:var(--dim)}
.stbl .tr.sel{background:var(--s3)}
.hint-line{font-size:12px;color:var(--dim);margin:6px 2px 0}

/* tabbar & fab */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;background:rgba(0,0,0,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--sb))}
.tabbar button{flex:1;max-width:200px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:600}
.tabbar button.on{color:var(--text)}
.tabbar svg{width:23px;height:23px}
.fab{position:fixed;right:max(16px,calc(50% - 364px));bottom:calc(78px + var(--sb));z-index:21;width:58px;height:58px;border-radius:50%;background:var(--text);color:#000;display:grid;place-items:center;box-shadow:0 8px 30px rgba(0,0,0,.6),0 0 0 1px #000}
.fab svg{width:26px;height:26px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .2s}
.sheet-wrap.open{background:rgba(0,0,0,.72)}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + var(--sb));transform:translateY(100%);transition:transform .22s ease}
.sheet-wrap.open .sheet{transform:none}
@media(min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;border-bottom:1px solid var(--line2)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:19px}
.form{display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:10px;margin-top:4px}
.form-actions .primary{flex:1}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0;line-height:1.5}
.file{position:relative;border:1px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);cursor:pointer}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file.has{border-style:solid;color:var(--text)}
.rc-cur{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;color:var(--text);padding:4px 2px}
.rc-cur a{text-decoration:underline;text-underline-offset:3px}
.chkline{flex-direction:row!important;align-items:center;gap:6px!important;font-weight:500!important}
.chkline input{width:18px;height:18px;-webkit-appearance:checkbox;appearance:checkbox;padding:0}
.preview img,.preview iframe{width:100%;border-radius:10px;border:0;background:#fff}
.preview iframe{height:70vh}

/* toast & busy */
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translate(-50%,20px);background:var(--text);color:#000;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .2s;z-index:80;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--neg);color:#fff}
.busy{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.45)}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid #333;border-top-color:var(--text);animation:spin .8s linear infinite}

/* ===== компьютер ===== */
.side-brand{display:none}
@media(min-width:1000px){
  .tabbar{top:0;bottom:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);background:var(--s1)}
  .side-brand{display:block;font-size:20px;font-weight:700;padding:6px 12px 22px}
  .tabbar button{flex:none;max-width:none;flex-direction:row;gap:12px;padding:11px 12px;border-radius:10px;font-size:15px;color:var(--muted)}
  .tabbar button:hover{background:var(--s2);color:var(--text)}
  .tabbar button.on{background:var(--s3);color:var(--text)}
  .tabbar svg{width:20px;height:20px}
  .top{margin-left:220px;padding:16px 32px}
  main{margin-left:220px;max-width:none;padding:24px 32px 60px}
  .tab{max-width:1200px;margin:0 auto}
  .fab{right:32px;bottom:32px}
  .toast{bottom:40px}
  #tab-records:not(.hidden){display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  #tab-records .cal{position:sticky;top:90px;padding:18px}
  .day{height:72px}
  .day .num{font-size:17px}
  .day-col .day-head{margin-top:4px}
  .period{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .period .seg{width:420px}
  .period-nav{margin-top:0}
  #kassaBody{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
  .k-right>.sec-head:first-child,.k-right>details:first-child{margin-top:0}
  .k-right .sec-head{margin-top:0}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .kpi.wide{grid-column:span 1;display:block}
  .kpi b,.kpi.wide b{font-size:24px}
  .chart-box{height:380px;padding:18px 14px 12px}
  .calc-keys button{height:56px}
}
@media(min-width:1000px) and (hover:hover){.rec:hover{background:var(--s2)}}
@media(max-width:380px){.kpi b{font-size:15px}.stbl .tr{font-size:12px;gap:6px}.tr{gap:8px}}
</style>
</head>
<body>

<!-- ВХОД -->
<section id="login">
  <div class="login-box">
    <div class="login-title">Журнал</div>
    <div class="login-sub">Введите код доступа</div>
    <form id="loginForm" autocomplete="off">
      <input id="codeInput" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" maxlength="32" aria-label="Код доступа">
      <button class="btn primary wide" id="loginBtn">Войти</button>
    </form>
    <div class="login-err" id="loginErr"></div>
    <div class="login-mode" id="loginMode"></div>
    <button class="link hidden" id="loginSettings" type="button">Подключение</button>
  </div>
</section>

<!-- ПРИЛОЖЕНИЕ -->
<section id="app" class="hidden">
  <header class="top">
    <div class="top-title"><span id="topTitle">Записи</span><span class="demo-badge hidden" id="demoBadge">ДЕМО</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="refreshBtn" title="Обновить" aria-label="Обновить"></button>
      <button class="icon-btn hidden" id="settingsBtn" title="Подключение" aria-label="Подключение"></button>
      <button class="icon-btn" id="lockBtn" title="Заблокировать" aria-label="Заблокировать"></button>
    </div>
  </header>

  <main>
    <div class="tab" id="tab-records">
      <div class="cal card">
        <div class="cal-head">
          <button class="nav" data-cal="-1" aria-label="Предыдущий месяц">‹</button>
          <div id="calTitle"></div>
          <button class="nav" data-cal="1" aria-label="Следующий месяц">›</button>
        </div>
        <div class="cal-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="day-col">
        <div class="day-head">
          <div><div class="h2" id="dayTitle"></div><div class="muted" id="daySub"></div></div>
          <button class="btn small" id="todayBtn">Сегодня</button>
        </div>
        <div id="dayList"></div>
      </div>
    </div>

    <div class="tab hidden" id="tab-kassa">
      <div class="period" data-period></div>
      <div id="kassaBody"></div>
    </div>

    <div class="tab hidden" id="tab-stats">
      <div class="period" data-period></div>
      <div id="statsKpi" class="kpis"></div>
      <div class="card chart-box"><canvas id="chart"></canvas><div class="chart-msg hidden" id="chartMsg"></div></div>
      <div class="hint-line" id="chartHint"></div>
      <div class="sec-head"><h2 id="stblTitle">По дням</h2></div>
      <div class="card table stbl" id="statsTable"></div>
      <div id="statsDay"></div>
    </div>
  </main>

  <button class="fab" id="fab" aria-label="Добавить"></button>

  <nav class="tabbar">
    <div class="side-brand">Журнал</div>
    <button data-tab="records" class="on"><span data-icon="cal"></span>Записи</button>
    <button data-tab="kassa"><span data-icon="wallet"></span>Касса</button>
    <button data-tab="stats"><span data-icon="chart"></span>Статистика</button>
  </nav>
</section>

<div class="sheet-wrap hidden" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<div class="busy hidden" id="busy"><div class="spinner"></div></div>

<script>
'use strict';
/* =========================================================
   НАСТРОЙКИ
   API_URL — адрес веб-приложения Apps Script. Можно оставить
   пустым и ввести адрес на экране входа → «Подключение»
   (так адрес не попадёт в публичный репозиторий).
   Пока адреса нет — работает демо-режим, код 0000.
   ========================================================= */

function upsertLocal(arr, item) { const i = arr.findIndex(x => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); }

/* ---------- API ---------- */
const apiUrl = () => API_URL || LS.get('api_url') || '';
const isDemo = () => !apiUrl();
const ERR = {
  auth: 'Неверный код', locked: 'Слишком много попыток. Подожди 15 минут',
  not_configured: 'На сервере не задан код доступа (ACCESS_CODE)', bad_request: 'Ошибка запроса', unknown_action: 'Неизвестная команда'
};

async function api(action, data) {
  if (isDemo()) return demoApi(action, data);
  let res;
  try {
    res = await fetch(apiUrl(), { method: 'POST', body: JSON.stringify({ action, code: S.code, data: data || {} }) });
  } catch (e) { throw new Error('Нет связи с сервером'); }
  if (!res.ok) throw new Error('Сервер недоступен (' + res.status + ')');
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Сервер ответил не так. Проверь адрес и доступ «Все»'); }
  if (!j.ok) {
    if ((j.error === 'auth' || j.error === 'locked') && action !== 'login') lock('Введите код снова');
    throw new Error(ERR[j.error] || j.error);
  }
  return j;
}

/* ---------- демо-режим (данные только в этом браузере) ---------- */
const REC_F = ['date', 'time', 'client', 'phone', 'car', 'service', 'amount', 'status', 'note'];
const EXP_F = ['date', 'category', 'description', 'amount'];
const pick = (o, keys) => Object.fromEntries(keys.filter(k => k in o).map(k => [k, o[k]]));

function demoApi(action, d) {
  return new Promise((res, rej) => setTimeout(() => { try { res(demoHandle(action, d || {})); } catch (e) { rej(e); } }, 150));
}
function demoHandle(action, d) {
  if (S.code !== DEMO_CODE) throw new Error('Неверный код. В демо-режиме код 0000');
  const get = k => { try { return JSON.parse(LS.get(k) || 'null'); } catch (e) { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { throw new Error('Не хватает места в браузере (демо). Удали старые чеки'); } };
  let recs = get('demo_records'), exps = get('demo_expenses');
  if (!recs) { const s = seedDemo(); recs = s.r; exps = s.e; put('demo_records', recs); put('demo_expenses', exps); }
  exps = exps || [];
  switch (action) {
    case 'login': return { ok: true };
    case 'list': return { ok: true, records: recs, expenses: exps };
    case 'saveRecord': {
      const i = recs.findIndex(x => x.id === d.id);
      const o = { ...(i >= 0 ? recs[i] : { id: uid() }), ...pick(d, REC_F) };
      o.amount = Number(o.amount) || 0;
      if (i >= 0) recs[i] = o; else recs.push(o);
      put('demo_records', recs); return { ok: true, item: o };
    }
    case 'deleteRecord': put('demo_records', recs.filter(x => x.id !== d.id)); return { ok: true };
    case 'saveExpense': {
      const i = exps.findIndex(x => x.id === d.id);
      const o = { ...(i >= 0 ? exps[i] : { id: uid() }), ...pick(d, EXP_F) };
      o.amount = Number(o.amount) || 0;
      if (d.removeReceipt) { o.receiptUrl = ''; o.receiptName = ''; }
      if (d.receipt) { o.receiptUrl = 'data:' + d.receipt.mime + ';base64,' + d.receipt.base64; o.receiptName = d.receipt.name; }
      if (i >= 0) exps[i] = o; else exps.push(o);
      put('demo_expenses', exps); return { ok: true, item: o };
    }
    case 'deleteExpense': put('demo_expenses', exps.filter(x => x.id !== d.id)); return { ok: true };
  }
  throw new Error('Неизвестная команда');
}
function seedDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const svc = [['Комплексная мойка', 2500], ['Химчистка салона', 9000], ['Полировка кузова', 15000], ['Керамика', 35000], ['Мойка двигателя', 2000], ['Бронеплёнка фар', 6000]];
  const names = ['Алексей', 'Дмитрий', 'Сергей', 'Иван', 'Михаил', 'Андрей', 'Артём', 'Никита', 'Олег', 'Роман'];
  const cars = ['BMW X5', 'Camry', 'Mercedes E', 'Kia Rio', 'Audi A6', 'Polo', 'Range Rover', 'Tiguan'];
  const r = [], e = [], base = new Date(); const t = today();
  for (let i = -80; i <= 6; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i); const ds = ymd(d);
    const n = Math.floor(rnd() * 4);
    for (let k = 0; k < n; k++) {
      const s = svc[Math.floor(rnd() * (rnd() < .7 ? 3 : svc.length))];
      const st = ds < t ? (rnd() < .08 ? 'cancelled' : 'done') : 'planned';
      r.push({ id: uid() + k + i, date: ds, time: pad(9 + k * 3 + Math.floor(rnd() * 2)) + ':' + (rnd() < .5 ? '00' : '30'), client: names[Math.floor(rnd() * names.length)], phone: '', car: cars[Math.floor(rnd() * cars.length)], service: s[0], amount: Math.round(s[1] * (0.9 + rnd() * 0.3) / 100) * 100, status: st, note: '' });
    }
    if (ds <= t) {
      if (d.getDate() === 1) e.push({ id: uid() + 'a' + i, date: ds, category: 'Аренда', description: 'Бокс', amount: 60000, receiptUrl: '', receiptName: '' });
      if (d.getDay() === 1) e.push({ id: uid() + 'h' + i, date: ds, category: 'Химия', description: 'Шампунь, очиститель', amount: Math.round((4000 + rnd() * 6000) / 100) * 100, receiptUrl: '', receiptName: '' });
      if (rnd() < .12) e.push({ id: uid() + 'r' + i, date: ds, category: 'Расходники', description: 'Микрофибра, аппликаторы', amount: Math.round((800 + rnd() * 2500) / 100) * 100, receiptUrl: '', receiptName: '' });
    }
  }
  return { r, e };
}

/* ---------- вход ---------- */
function showLogin(msg) {
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#codeInput').value = ''; $('#loginErr').textContent = msg || '';

  S.code = null; SS.del('code'); S.records = []; S.expenses = [];

async function doLogin(e) {
  e.preventDefault();
  const code = $('#codeInput').value.trim(); if (!code) return;
  const btn = $('#loginBtn'); btn.disabled = true; btn.textContent = 'Проверка…';
  S.code = code;
  try { await api('login'); SS.set('code', code); showApp(); await load(); }
  catch (err) { S.code = null; $('#loginErr').textContent = err.message; $('#codeInput').value = ''; }
  finally { btn.disabled = false; btn.textContent = 'Войти'; }
}
async function load() {
  setSync(true);
  try {
    const j = await api('list');
    S.records = (j.records || []).map(normRec);
    S.expenses = (j.expenses || []).map(normExp);
    renderAll();
  } catch (e) { if (S.code) toast(e.message, true); }
  finally { setSync(false); }
}

/* ---------- вкладка 1: записи ---------- */
function fmtDayLong(s) {
  const d = parse(s), t = today();
  const tm = new Date(); tm.setDate(tm.getDate() + 1);
  const pre = s === t ? 'Сегодня, ' : s === ymd(tm) ? 'Завтра, ' : '';
  return pre + d.getDate() + ' ' + MONTHS_GEN[d.getMonth()] + (pre ? '' : ', ' + WD[d.getDay()]);
}
const fmtShort = s => { const d = parse(s); return pad(d.getDate()) + '.' + pad(d.getMonth() + 1); };
function syncCalToSel() { const d = parse(S.sel); S.calY = d.getFullYear(); S.calM = d.getMonth(); }

function renderCalendar() {
  const y = S.calY, m = S.calM;
  $('#calTitle').textContent = MONTHS[m] + ' ' + y;
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const by = {};
  S.records.forEach(r => { if (r.status !== 'cancelled') (by[r.date] = by[r.date] || []).push(r); });
  const t = today(); let h = '';
  for (let i = 0; i < offset; i++) h += '<div></div>';
  for (let d = 1; d <= days; d++) {
    const s = y + '-' + pad(m + 1) + '-' + pad(d), list = by[s] || [];
    const done = Math.min(list.filter(r => r.status === 'done').length, 3);
    const plan = Math.min(list.length - list.filter(r => r.status === 'done').length, 3 - done);
    h += `<button class="day${s === t ? ' today' : ''}${s === S.sel ? ' sel' : ''}${list.length ? ' has' : ''}" data-date="${s}"><span class="num">${d}</span><span class="dots">${'<i class="d"></i>'.repeat(done)}${'<i></i>'.repeat(plan)}</span></button>`;
  }
  $('#calGrid').innerHTML = h;
}
function renderDay() {
  const list = S.records.filter(r => r.date === S.sel).sort(byDT);
  const done = list.filter(r => r.status === 'done'), planned = list.filter(r => r.status === 'planned');
  $('#dayTitle').textContent = fmtDayLong(S.sel);
  $('#daySub').textContent = list.length
    ? `${list.length} ${plural(list.length, 'запись', 'записи', 'записей')} · выполнено ${money(sum(done))}` + (planned.length ? ` · ожидается ${money(sum(planned))}` : '')
    : 'Записей нет';
  $('#dayList').innerHTML = list.length ? list.map(recCard).join('') : '<div class="empty">Нажми «+», чтобы добавить запись на этот день</div>';
}
function recCard(r) {
  return `<div class="rec ${r.status}" data-edit-rec="${esc(r.id)}">
    <div class="rec-time">${esc(r.time || '—')}</div>
    <div class="rec-main">
      <div class="rec-client">${esc(r.client || 'Без имени')}</div>
      <div class="rec-sub">${esc([r.service, r.car].filter(Boolean).join(' · ') || '—')}</div>
      ${r.status === 'cancelled' ? '<span class="rec-tag">Отменена</span>' : ''}
    </div>
    <div class="rec-amt">${money(r.amount)}</div>

  </div>`;

async function saveRecord(data) {
  busy(true);
  try {
    const j = await api('saveRecord', data);
    upsertLocal(S.records, normRec(j.item)); renderAll(); toast('Сохранено'); return true;
  } catch (e) { toast(e.message, true); return false; }
  finally { busy(false); }
}
function toggleDone(id) {
  const r = S.records.find(x => x.id === id); if (!r) return;
  saveRecord({ ...pick(r, REC_F), id: r.id, status: r.status === 'done' ? 'planned' : 'done' });
}
function uniq(list) { const seen = new Set(); return list.filter(x => { const k = x.toLowerCase(); if (!x || seen.has(k)) return false; seen.add(k); return true; }); }

function openRecord(id) {

      ${r && r.phone ? `<a class="btn" href="tel:${esc(r.phone.replace(/[^\d+]/g, ''))}" style="text-align:center;text-decoration:none">Позвонить клиенту</a>` : ''}
      <div class="form-actions">

  const f = $('#recForm');
  f.service.addEventListener('change', () => {
    if (f.amount.value) return;

    if (last) f.amount.value = last.amount;
  });
  f.addEventListener('submit', async e => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(f));
    if (!data.date) return toast('Укажи дату', true);
    if (!data.client.trim() && !data.service.trim()) return toast('Укажи клиента или услугу', true);
    data.amount = Number(data.amount) || 0;

  });
  if (r) $('#delRec').onclick = async () => {

    busy(true);
    try { await api('deleteRecord', { id: r.id }); S.records = S.records.filter(x => x.id !== r.id); closeSheet(); renderAll(); toast('Удалено'); }
    catch (e) { toast(e.message, true); } finally { busy(false); }

/* ---------- период (Касса и Статистика) ---------- */
function range(mode = S.mode, a = S.anchor) {
  const d = parse(a), y = d.getFullYear(), m = d.getMonth();
  if (mode === 'day') return { start: a, end: a };
  if (mode === 'month') return { start: ymd(new Date(y, m, 1)), end: ymd(new Date(y, m + 1, 0)) };
  if (mode === 'quarter') { const q = Math.floor(m / 3) * 3; return { start: ymd(new Date(y, q, 1)), end: ymd(new Date(y, q + 3, 0)) }; }
  return { start: y + '-01-01', end: y + '-12-31' };
}
function periodLabel() {
  const d = parse(S.anchor), y = d.getFullYear(), m = d.getMonth();
  if (S.mode === 'day') return fmtDayLong(S.anchor) + (y !== now0.getFullYear() ? ' ' + y : '');
  if (S.mode === 'month') return MONTHS[m] + ' ' + y;
  if (S.mode === 'quarter') return QN[Math.floor(m / 3)] + ' квартал ' + y;
  return y + ' год';
}
function shiftPeriod(dir) {
  const d = parse(S.anchor), y = d.getFullYear(), m = d.getMonth();
  let n;
  if (S.mode === 'day') { n = new Date(d); n.setDate(d.getDate() + dir); }
  else if (S.mode === 'month') n = new Date(y, m + dir, 1);
  else if (S.mode === 'quarter') n = new Date(y, m + 3 * dir, 1);
  else n = new Date(y + dir, 0, 1);
  S.anchor = ymd(n); renderAll();
}
function renderPeriodBars() {
  const modes = [['day', 'День'], ['month', 'Месяц'], ['quarter', 'Квартал'], ['year', 'Год']];
  const html = `<div class="seg">${modes.map(([k, l]) => `<button data-mode="${k}" class="${S.mode === k ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="period-nav">
      <button class="nav" data-shift="-1" aria-label="Назад">‹</button>
      <label class="period-label">${esc(periodLabel())}<input type="date" class="period-date" value="${S.anchor}" aria-label="Выбрать дату"></label>
      <button class="nav" data-shift="1" aria-label="Вперёд">›</button>
    </div>`;
  $$('[data-period]').forEach(el => { el.innerHTML = html; });
}
function periodData() {
  const { start, end } = range(); const inR = x => x.date >= start && x.date <= end;
  const done = S.records.filter(r => r.status === 'done' && inR(r)).sort(byDT);
  const planned = S.records.filter(r => r.status === 'planned' && inR(r));
  const exps = S.expenses.filter(inR).sort(byDT);
  const rev = sum(done), exp = sum(exps);
  return { start, end, done, planned, exps, rev, exp, profit: rev - exp };
}

/* калькулятор */
const prettyCalc = s => s.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
function calcEval(s) {
  s = s.replace(/[+\-*/.]+$/, '');
  if (!s || !/^[\d+\-*/. ]+$/.test(s)) return null;
  try { const v = Function('"use strict";return (' + s + ')')(); return isFinite(v) ? Math.round(v * 100) / 100 : null; } catch (e) { return null; }
}
function updateCalcPreview() {
  const el = $('#calcPrev'); if (!el) return;
  const v = /[+\-*/]/.test(S.calc.slice(1)) ? calcEval(S.calc) : null;
  el.textContent = v == null ? '' : '= ' + nf.format(v);
}
function calcKey(k) {
  let s = S.calc;
  const ops = { '÷': '/', '×': '*', '−': '-', '+': '+' };
  if (k === 'C') s = '';
  else if (k === '⌫') s = s.slice(0, -1);
  else if (k === '=') { const v = calcEval(s); s = v == null ? s : String(v); }
  else if (k === '%') { const m = s.match(/(\d+\.?\d*)$/); if (m) s = s.slice(0, -m[1].length) + String(Number(m[1]) / 100); }
  else if (ops[k]) { if (/[+\-*/]$/.test(s)) s = s.slice(0, -1); if (s || k === '−') s += ops[k]; }
  else if (k === '.') { const m = s.match(/[\d.]*$/)[0]; if (!m.includes('.')) s += m ? '.' : '0.'; }
  else s += k;
  S.calc = s;
  $('#calcDisp').textContent = prettyCalc(s) || '0';
  updateCalcPreview();
}
function calcInsert(v) {
  let s = S.calc;
  if (!s || /[+\-*/]$/.test(s)) s += String(v); else s += '+' + String(v);
  S.calc = s.replace(/\+-/g, '-').replace(/--/g, '+');
  $('#calcDisp').textContent = prettyCalc(S.calc); updateCalcPreview();
}

/* расходы */
function readAsDataURL(file) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(file); }); }
async function fileToPayload(file) {
  if (file.type.startsWith('image/') && file.type !== 'image/gif') {
    try {
      const url = await readAsDataURL(file);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      return { name: file.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', base64: c.toDataURL('image/jpeg', 0.82).split(',')[1] };
    } catch (e) { /* отправим как есть */ }
  }
  if (file.size > 10 * 1024 * 1024) throw new Error('Файл больше 10 МБ');
  const url = await readAsDataURL(file);
  return { name: file.name, mime: file.type || 'application/octet-stream', base64: url.split(',')[1] };
}

/* ---------- вкладка 3: статистика ---------- */
function buckets() {
  const a = parse(S.anchor), y = a.getFullYear(), out = [];
  if (S.mode === 'day') {
    const mon = new Date(a); mon.setDate(a.getDate() - (a.getDay() + 6) % 7);
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i); const s = ymd(d);
      out.push({ label: WD[d.getDay()] + ' ' + d.getDate(), long: WD[d.getDay()] + ', ' + fmtShort(s), start: s, end: s, drill: { mode: 'day', anchor: s }, sel: s === S.anchor });
    }
  } else if (S.mode === 'month') {
    const m = a.getMonth(), days = new Date(y, m + 1, 0).getDate();
    for (let i = 1; i <= days; i++) {
      const d = new Date(y, m, i), s = ymd(d);
      out.push({ label: String(i), long: WD[d.getDay()] + ', ' + fmtShort(s), start: s, end: s, drill: { mode: 'day', anchor: s } });
    }
  } else {
    const first = S.mode === 'quarter' ? Math.floor(a.getMonth() / 3) * 3 : 0, n = S.mode === 'quarter' ? 3 : 12;
    for (let m = first; m < first + n; m++) {
      out.push({ label: MONTHS_SHORT[m], long: MONTHS[m], start: ymd(new Date(y, m, 1)), end: ymd(new Date(y, m + 1, 0)), drill: { mode: 'month', anchor: ymd(new Date(y, m, 1)) } });
    }
  }
  out.forEach(b => {
    const inB = x => x.date >= b.start && x.date <= b.end;
    const done = S.records.filter(r => r.status === 'done' && inB(r));
    b.rev = sum(done); b.exp = sum(S.expenses.filter(inB)); b.profit = b.rev - b.exp; b.count = done.length;
  });
  return out;
}

    ${isDemo() ? '<div style="margin-top:14px"><button class="btn danger wide" id="demoReset">Очистить демо-данные</button></div>' : ''}`);
  const f = $('#setForm');
  f.addEventListener('submit', e => {
    e.preventDefault();
    const url = f.url.value.trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('Нужен адрес вида https://script.google.com/…/exec', true);
    if (url) LS.set('api_url', url); else LS.del('api_url');
    toast(url ? 'Сервер подключён' : 'Включён демо-режим');
    lock(url ? 'Сервер подключён — введите код' : '');
  });
  const r = $('#demoReset');
  if (r) r.onclick = () => {
    if (!confirm('Удалить все демо-записи и расходы?')) return;
    LS.set('demo_records', '[]'); LS.set('demo_expenses', '[]');
    S.records = []; S.expenses = []; closeSheet(); renderAll(); toast('Демо-данные очищены');
  };
}

/* ---------- события ---------- */
function bind() {
  $('#refreshBtn').innerHTML = ICON.refresh; $('#settingsBtn').innerHTML = ICON.gear; $('#lockBtn').innerHTML = ICON.lock; $('#fab').innerHTML = ICON.plus;
  $$('[data-icon]').forEach(el => { el.outerHTML = ICON[el.dataset.icon]; });

  $('#loginForm').addEventListener('submit', doLogin);
  $('#loginSettings').addEventListener('click', openSettings);
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#refreshBtn').addEventListener('click', () => load());
  $('#lockBtn').addEventListener('click', () => lock());
  $('#todayBtn').addEventListener('click', () => { S.sel = today(); syncCalToSel(); renderAll(); });
  $('#fab').addEventListener('click', () => S.tab === 'kassa' ? openExpense() : openRecord());
  $('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') return closeSheet();
    if (!S.code || e.ctrlKey || e.metaKey || e.altKey || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !$('#sheetWrap').classList.contains('hidden')) return;
    const tabs = { '1': 'records', '2': 'kassa', '3': 'stats' };
    if (tabs[e.key]) setTab(tabs[e.key]);
    else if (e.key === 'n' || e.key === 'т') S.tab === 'kassa' ? openExpense() : S.tab === 'records' && openRecord();
    else if (S.tab !== 'records' && e.key === 'ArrowLeft') shiftPeriod(-1);
    else if (S.tab !== 'records' && e.key === 'ArrowRight') shiftPeriod(1);
  });
  document.addEventListener('change', e => {
    if (e.target.classList.contains('period-date') && e.target.value) { S.anchor = e.target.value; renderAll(); }
  });

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-tab],[data-close],[data-cal],[data-date],[data-toggle],[data-edit-rec],[data-mode],[data-shift],[data-add-exp],[data-view-rcpt],[data-stop],[data-edit-exp],[data-drill],[data-k],[data-calc-ins]');
    if (!t) return;
    const d = t.dataset;
    if ('tab' in d) setTab(d.tab);
    else if ('close' in d) closeSheet();
    else if ('cal' in d) { S.calM += Number(d.cal); if (S.calM < 0) { S.calM = 11; S.calY--; } if (S.calM > 11) { S.calM = 0; S.calY++; } renderCalendar(); }
    else if ('date' in d) { S.sel = d.date; renderCalendar(); renderDay(); }
    else if ('toggle' in d) { e.stopPropagation(); toggleDone(d.toggle); }
    else if ('editRec' in d) openRecord(d.editRec);
    else if ('mode' in d) { S.mode = d.mode; renderAll(); }
    else if ('shift' in d) shiftPeriod(Number(d.shift));
    else if ('addExp' in d) openExpense();
    else if ('viewRcpt' in d) { e.preventDefault(); viewReceipt(d.viewRcpt); }
    else if ('stop' in d) { /* открыть ссылку на чек, не открывая расход */ }
    else if ('editExp' in d) openExpense(d.editExp);
    else if ('drill' in d) drill(S.buckets[Number(d.drill)]);
    else if ('k' in d) calcKey(d.k);
    else if ('calcIns' in d) calcInsert(Number(d.calcIns));
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { S.hiddenAt = Date.now(); return; }
    if (!S.code) return;
    if (S.hiddenAt && Date.now() - S.hiddenAt > AUTO_LOCK_MIN * 60000) lock();
    else load();
  });
}

document.addEventListener('DOMContentLoaded', () => {
  bind();
  const saved = SS.get('code');
  if (saved) { S.code = saved; showApp(); load(); } else showLogin();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
});
</script>
